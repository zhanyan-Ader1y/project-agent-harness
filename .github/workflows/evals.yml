# DESIGN.md 的 eval 门禁：skills/ hooks/ scripts/ 任一变更即跑，
# 冒烟集必须 100% 通过才可合入。
#
# 注意：本仓库尚无远端，**此工作流从未实际运行过**。
name: evals

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # plugin 名与 MCP server 名决定 hook matcher 的前缀，改它们必须重跑，
      # 所以覆盖整个 plugins/ 与 .claude-plugin/，不只是 skills/hooks/scripts。
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'evals/**'
      - '.github/workflows/evals.yml'

jobs:
  evals:
    # 已知的静默失效点几乎都是 Windows 特有的：MSYS coreutils 自行展开 ~ 与
    # glob、`echo '单引号 JSON'` 在 cmd.exe 下解析失败。只跑 ubuntu 等于
    # 那些用例在门禁里一次也不执行。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装 ripgrep（Linux）
        # 符号检查在 rg 与 grep 之间回退，用例对两个后端各断言一遍。
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: 跑全部 eval
        run: node evals/run-all.js
